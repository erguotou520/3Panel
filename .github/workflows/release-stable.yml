name: Release stable

# Builds the 3Panel release package and publishes it to the paths the panel's
# upgrade logic actually requests (see core/app/service/upgrade.go):
#
#   {RepoURL}/{channel}/latest
#   {RepoURL}/{channel}/latest.current
#   {RepoURL}/{channel}/{version}/release/3panel-{version}-linux-{arch}.tar.gz
#   {RepoURL}/{channel}/{version}/release/3panel-{version}-linux-{arch}.tar.gz.sha256
#   {RepoURL}/{channel}/{version}/release/3panel-{version}-release-notes
#
# plus the resource object the panel fetches when /usr/local/bin/lang is absent:
#
#   {RESOURCE_BASE}/language/lang.tar.gz
#
# with RepoURL = https://generic.cloudsmith.io/3panel/3panel/package.
# Only the stable channel is published. The project no longer maintains a
# compatibility copy in dev.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

env:
  RESOURCE_BASE: https://generic.cloudsmith.io/3panel/3panel/resource
  OUT_DIR: ${{ github.workspace }}/dist

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # latest.current is derived from the tag list, so full history is needed.
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "version '$VERSION' does not look like vX.Y.Z" >&2
            exit 1
          fi
          if printf '%s' "$VERSION" | grep -q 'beta'; then
            echo "beta tags are not published; stable is the only supported channel" >&2
            exit 1
          fi
          CHANNEL=stable
          CHANNELS=stable
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"
          echo "building $VERSION (channel: $CHANNEL, publish to: $CHANNELS)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            agent/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build packages
        run: |
          chmod +x packaging/build-release.sh
          ./packaging/build-release.sh "${{ steps.ver.outputs.version }}" amd64 arm64

      - name: Generate release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNELS: ${{ steps.ver.outputs.channels }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          {
            echo "## 3Panel $VERSION"
            echo
            echo "Released $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "### Packages"
            for f in "$OUT_DIR"/3panel-"$VERSION"-linux-*.tar.gz; do
              [ -e "$f" ] || continue
              echo "- \`$(basename "$f")\`"
            done
            echo
            echo "### Agent-only packages (for hosts joining as a node)"
            for f in "$OUT_DIR"/3panel-agent-"$VERSION"-linux-*.tar.gz; do
              [ -e "$f" ] || continue
              echo "- \`$(basename "$f")\`"
            done
            echo
            echo "### Checksums"
            echo '```'
            for f in "$OUT_DIR"/3panel-"$VERSION"-linux-*.tar.gz.sha256 \
                     "$OUT_DIR"/3panel-agent-"$VERSION"-linux-*.tar.gz.sha256; do
              [ -e "$f" ] || continue
              echo "$(cat "$f")  $(basename "$f" .sha256)"
            done
            echo '```'
          } > "$NOTES"
          for CHANNEL in $CHANNELS; do
            DIR="$OUT_DIR/package/$CHANNEL/$VERSION/release"
            mkdir -p "$DIR"
            cp "$NOTES" "$DIR/3panel-$VERSION-release-notes"
          done
          echo "wrote release notes to: $CHANNELS"
          cat "$NOTES"

      - name: Generate channel indexes
        env:
          PRIMARY: ${{ steps.ver.outputs.channel }}
          CHANNELS: ${{ steps.ver.outputs.channels }}
        run: |
          set -euo pipefail
          # Maps each minor line (vX.Y) to its newest patch release inside that
          # line. This is what the panel looks up as versionMap[currentVersion[0:4]]
          # (or [0:5] when the minor is >= 10) for installs that are behind.
          for CHANNEL in $CHANNELS; do
            mkdir -p "$OUT_DIR/package/$CHANNEL"
            if [ "$CHANNEL" != "$PRIMARY" ]; then
              # `latest` is written by build-release.sh for the primary channel only.
              # For a non-beta release its content is the bare version string, which
              # is identical across channels, so a byte-for-byte copy is exact.
              cp "$OUT_DIR/package/$PRIMARY/latest" "$OUT_DIR/package/$CHANNEL/latest"
            fi
            git tag -l 'v*' | CHANNEL="$CHANNEL" python3 -c '
          import json, os, re, sys

          want_beta = os.environ["CHANNEL"] == "beta"
          pat = re.compile(r"^v(\d+)\.(\d+)\.(\d+)")
          best = {}
          for tag in sys.stdin.read().split():
              if ("beta" in tag) != want_beta:
                  continue
              m = pat.match(tag)
              if not m:
                  continue
              key = "v%s.%s" % (m.group(1), m.group(2))
              cur = best.get(key)
              if cur is None or tuple(map(int, pat.match(cur).groups())) < tuple(map(int, m.groups())):
                  best[key] = tag
          json.dump(best, sys.stdout, sort_keys=True)
          ' > "$OUT_DIR/package/$CHANNEL/latest.current"
          done
          echo "latest.current:"; cat "$OUT_DIR/package/${{ steps.ver.outputs.channel }}/latest.current"; echo

      - name: Show artifact tree
        run: find "$OUT_DIR" -type f | sort

      - name: Install Cloudsmith CLI
        run: |
          install_output="$(curl -fsSL https://install.cloudsmith.com/raw/versions/latest/cli.sh | sh)"
          bin_dir="$(printf '%s\n' "$install_output" | sed -n 's/^bin_dir=//p')"
          [ -n "$bin_dir" ] || { echo "Cloudsmith CLI installation did not return bin_dir" >&2; exit 1; }
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Publish stable artifacts to Cloudsmith
        run: |
          set -euo pipefail
          [ -n "${CLOUDSMITH_API_KEY:-}" ] || { echo "CS_TOKEN is not configured" >&2; exit 1; }
          VERSION="${{ steps.ver.outputs.version }}"
          publish() { cloudsmith push generic 3panel/3panel "$1" --filepath "$2" --republish; }
          for f in "$OUT_DIR"/3panel-"$VERSION"-linux-* "$OUT_DIR"/3panel-agent-"$VERSION"-linux-*; do
            [ -f "$f" ] && publish "$f" "package/stable/$VERSION/release/$(basename "$f")"
          done
          publish "$OUT_DIR/package/stable/$VERSION/release/3panel-$VERSION-release-notes" "package/stable/$VERSION/release/3panel-$VERSION-release-notes"
          publish "$OUT_DIR/package/stable/latest" "package/stable/latest"
          publish "$OUT_DIR/package/stable/latest.current" "package/stable/latest.current"
          publish "$OUT_DIR/lang.tar.gz" "resource/language/lang.tar.gz"
          for asset in quick_start.sh join.sh install-agent.sh upgrade-agent.sh; do publish "$OUT_DIR/$asset" "package/$asset"; done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: ${{ env.OUT_DIR }}/package/${{ steps.ver.outputs.channel }}/${{ steps.ver.outputs.version }}/release/3panel-${{ steps.ver.outputs.version }}-release-notes
          files: |
            dist/3panel-*.tar.gz
            dist/3panel-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
