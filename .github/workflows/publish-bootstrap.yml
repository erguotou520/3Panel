name: Publish bootstrap scripts

# The bootstrap scripts are fetched by end users at FIXED paths with no version
# in them:
#
#   bash -c "$(curl -sSL https://generic.cloudsmith.io/3panel/3panel/package/quick_start.sh)"
#   PANEL3_MASTER=... PANEL3_TOKEN=... bash -c "$(curl -sSL https://generic.cloudsmith.io/3panel/3panel/package/join.sh)"
#   bash -c "$(curl -sSL https://generic.cloudsmith.io/3panel/3panel/package/upgrade-agent.sh)"
#
# so a change to one of them only reaches users if something uploads it.
# release-stable.yml does that too, but tying it to a version tag would mean a
# bug fix in a bootstrap script sits unpublished until the next release. This
# workflow publishes them on every change instead, and can be run by hand.
#
#   packaging/quick_start.sh    -> /package/quick_start.sh     (install a panel)
#   packaging/join.sh           -> /package/join.sh            (join a node)
#   packaging/install-agent.sh  -> /package/install-agent.sh   (used by join.sh
#                                  when it has to fall back to the full package)
#   packaging/upgrade-agent.sh  -> /package/upgrade-agent.sh   (upgrade a node)

on:
  push:
    branches: [main]
    paths:
      - packaging/quick_start.sh
      - packaging/join.sh
      - packaging/install-agent.sh
      - packaging/upgrade-agent.sh
      - .github/workflows/publish-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity-check the scripts
        run: |
          set -euo pipefail
          for f in quick_start.sh join.sh install-agent.sh upgrade-agent.sh; do
            bash -n "packaging/$f"
            echo "$f OK, $(wc -c < "packaging/$f") bytes"
          done

      - name: Install Cloudsmith CLI
        run: |
          install_output="$(curl -fsSL https://install.cloudsmith.com/raw/versions/latest/cli.sh | sh)"
          bin_dir="$(printf '%s\n' "$install_output" | sed -n 's/^bin_dir=//p')"
          [ -n "$bin_dir" ] || { echo "Cloudsmith CLI installation did not return bin_dir" >&2; exit 1; }
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Publish bootstrap scripts to Cloudsmith
        run: |
          set -euo pipefail
          [ -n "${CLOUDSMITH_API_KEY:-}" ] || { echo "CS_TOKEN is not configured" >&2; exit 1; }
          for f in quick_start.sh join.sh install-agent.sh upgrade-agent.sh; do
            cloudsmith push generic 3panel/3panel "packaging/$f" --filepath "package/$f" --republish
            echo "published -> package/$f"
          done
