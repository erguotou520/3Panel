version: 2

# 依赖版本巡检：gomod(agent/core) 与 npm(frontend + scripts/*) 每日检查。
# 配合 depbot-automerge.yml：CI 全绿自动合并（squash），失败时呼叫 @copilot 修复。
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/agent"
      - "/core"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/scripts/appstore-mirror"
      - "/scripts/cf-appstore-sync"
      - "/scripts/waf-reporter"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "npm"
