<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="832" viewBox="0 0 1000 832" fill="none" role="img" aria-label="3Panel">
    <defs>
        <linearGradient id="login-bg" x1="60" y1="0" x2="1000" y2="832" gradientUnits="userSpaceOnUse">
            <stop stop-color="#1B47D6" />
            <stop offset="0.52" stop-color="#3E6BF0" />
            <stop offset="1" stop-color="#EEF3FF" />
        </linearGradient>
        <linearGradient id="login-glass" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF" stop-opacity="0.96" />
