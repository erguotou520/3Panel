        <linearGradient id="login-donut" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#8FC0FF" />
            <stop offset="1" stop-color="#2B57E8" />
        </linearGradient>
        <filter id="login-soft" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0A2A85" flood-opacity="0.22" />
        </filter>
        <pattern id="login-dots" width="26" height="26" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="2" fill="#FFFFFF" opacity="0.13" />
        </pattern>
    </defs>

